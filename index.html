<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="LLM Campus - LL.M. academic timetable dashboard">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./assets/app.css">
<title>LLM Campus</title>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="container topbar-inner">
    <div class="brand">
      <div class="brand-mark">⚖</div>
      <div>
        <strong>LLM Campus</strong>
        <small>LL.M. 1st Year</small>
      </div>
    </div>
    <button id="installBtn" class="install-btn" type="button" hidden>Install</button>
  </div>
</header>

<main class="container page">
  <section class="hero">
    <div>
      <div id="todayDate" class="eyebrow"></div>
      <h1 id="greeting">Welcome</h1>
      <p class="muted">Your lectures, attendance and notes in one place.</p>
    </div>
    <div id="nextCard" class="next-card"></div>
  </section>

  <section id="stats" class="stats"></section>

  <div id="dayTabs" class="day-tabs"></div>

  <section id="todaySection">
    <div class="section-head">
      <h2 id="scheduleTitle">Today's lectures</h2>
      <button id="refreshBtn" class="text-btn" type="button">Refresh</button>
    </div>
    <div id="schedule"></div>
  </section>

  <section id="weekSection" class="hidden">
    <div class="section-head"><h2>Weekly timetable</h2></div>
    <div id="week"></div>
  </section>

  <section id="subjectsSection" class="hidden">
    <div class="section-head"><h2>Subjects</h2></div>
    <div id="subjects" class="card-grid"></div>
  </section>

  <section id="attendanceSection" class="hidden">
    <div class="section-head">
      <h2>Attendance</h2>
      <button id="resetAttendance" class="text-btn" type="button">Reset</button>
    </div>
    <div id="attendance"></div>
  </section>

  <section id="notesSection" class="hidden">
    <div class="section-head">
      <h2>Quick Notes</h2>
      <button id="saveNotes" class="text-btn" type="button">Save</button>
    </div>
    <textarea id="notes" class="notes" placeholder="Write lecture points, cases, questions or reminders..."></textarea>
    <p class="muted tiny">Notes are saved on this device.</p>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="today" type="button">🏠<span>Today</span></button>
  <button class="nav-item" data-view="week" type="button">📅<span>Week</span></button>
  <button class="nav-item" data-view="subjects" type="button">📚<span>Subjects</span></button>
  <button class="nav-item" data-view="attendance" type="button">📊<span>Attendance</span></button>
  <button class="nav-item" data-view="notes" type="button">📝<span>Notes</span></button>
</nav>

<div id="toast" class="toast"></div>
</div>

<script src="./assets/data.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
